<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videokê</title>
    <style>
      :root {
        --rosa_intenso: #ec4899;
        --preto: #000000;
        --rosa_suave: #fce4ec;
        --cinza_escuro: #333333;
        --branco: #ffffff;
      }

      body {
        color: var(--cinza_escuro);
        font-family: Arial, Helvetica, sans-serif;
      }

      h1,
      .nome_musica {
        color: var(--rosa_intenso);
      }

      h2 {
        color: var(--preto);
      }

      p {
        color: var(--cinza_escuro);
      }

      button {
        color: var(--rosa_intenso);
      }

      .item_musica {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .nome_musica {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Videokê</h1>

      <section aria-labelledby="biblioteca_de_musicas">
        <h2 id="biblioteca_de_musicas">Biblioteca de músicas</h2>
        <p>Selecione a pasta onde estão guardadas as músicas para montar um catálogo.</p>
        <button type="button" id="selecionar_pasta">Selecionar pasta</button>
      </section>

      <section aria-labelledby="catalogo_de_musicas">
        <h2 id="catalogo_de_musicas">Catálogo de músicas</h2>
        <p>Selecione uma música da lista para preparar sua apresentação.</p>
        <ul id="catalogo_musicas">
          <li class="item_musica">
            <h3 class="nome_musica">Nome da música</h3>
            <button type="button" class="escolher_musica">
              Escolher esta música
            </button>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
